<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>순수튜브</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="menuBtn" class="ghost icon" title="메뉴">☰</button>
  <a class="logo" href="#/"><span class="mark">▶</span> 순수튜브</a>
  <form id="searchForm" class="search"><input id="q" placeholder="검색" autocomplete="off"><button title="찾기">🔍</button></form>
  <button id="uploadBtn" class="primary">＋ 영상 올리기</button>
</header>
<nav id="side" class="nav">
  <a href="#/" data-nav="home">🏠 홈</a>
  <a href="#/popular" data-nav="popular">🔥 인기</a>
  <a href="#/playlists" data-nav="playlists">📚 재생 목록</a>
  <hr>
  <a href="#/history" data-nav="history">🕘 시청 기록</a>
  <a href="#/later" data-nav="later">⏰ 나중에 볼 영상</a>
  <hr>
  <a href="#/admin" data-nav="admin">⚙ 관리</a>
</nav>
<main id="view"></main>
<footer class="foot"><span id="disk"></span></footer>

<dialog id="uploadDlg">
  <form id="uploadForm" method="dialog">
    <h2>영상 올리기</h2>
    <label class="drop" id="drop"><input id="file" type="file" accept="video/*,.mkv,.avi,.mov,.3gp" multiple hidden><b>영상 파일 고르기 (여러 개 가능)</b><span>또는 여기에 끌어다 놓으세요</span></label>
    <div id="upList"></div>
    <label>분류 <select id="upCat"></select></label>
    <label>설명 <textarea id="upDesc" rows="2" maxlength="2000" placeholder="영상 설명"></textarea></label>
    <label>태그 <input id="upTags" placeholder="쉼표로 구분"></label>
    <label>공개 범위 <select id="upVis"><option value="public">공개 (목록과 검색에 보임)</option><option value="unlisted">링크로만 (목록에 숨김)</option></select></label>
    <p id="upMsg" class="msg"></p>
    <div class="row"><button type="button" id="upCancel" class="ghost">닫기</button><button type="submit" id="upGo" class="primary">올리기</button></div>
    <p class="hint">자동으로 720p·360p 로 줄여 저장해요. 올리다 끊겨도 같은 파일을 다시 고르면 이어서 올라가요.</p>
  </form>
</dialog>
<dialog id="dlg"></dialog>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
